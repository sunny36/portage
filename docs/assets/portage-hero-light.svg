<text x="780" y="256" class="stage" text-anchor="middle">Record</text>
<text x="780" y="356" class="desc" text-anchor="middle">newest version</text>
<text x="780" y="378" class="desc" text-anchor="middle">always wins</text>
<path d="M290,444 H396 Q420,444 420,420 V396" fill="none" stroke="#4F53B0" stroke-width="2.2" stroke-dasharray="7 7" class="march" marker-end="url(#arrow-indigo)"/>
