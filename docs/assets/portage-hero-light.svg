<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img"
  aria-labelledby="t d">
<title id="t">How Portage works</title>
<desc id="d">A new file lands in the source bucket (Azure Blob Storage). Portage detects it from a
storage event, or from a periodic reconciler scan if the event was lost; copies it in parallel,
resumable parts; verifies it with SHA-256 and a read-back; and records the synced version so the
newest version always wins. The file then appears in the destination bucket (OCI Object Storage).
Guarantees: newest version always wins, checksum-verified, resumes after a crash, deletes off by default.</desc>
<defs>
  <style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #15222B; }
  .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; letter-spacing: .12em; fill: #0B7A6B; font-weight: 600; }
  .name { font-size: 23px; font-weight: 700; }
  .title { font-size: 34px; font-weight: 800; letter-spacing: -.01em; }
  .sub { font-size: 17px; fill: #5B6B73; }
  .file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; }
  .file.strong { font-weight: 700; }
  .size { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #5B6B73; }
  .stage { font-size: 21px; font-weight: 700; }
  .num { font-size: 19px; font-weight: 800; fill: #0B7A6B; }
  .desc { font-size: 17px; fill: #5B6B73; }
  .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; letter-spacing: .04em; }
  .chip { font-size: 17.5px; font-weight: 600; }
  .glow { opacity: 0; }

  .pkt    { animation: pkt 7s ease-in-out infinite; }
  .parts  { animation: parts 7s ease-in-out infinite; }
  .okbadge{ animation: ok 7s ease-out infinite; }
  .g0 { animation: g0 7s infinite; } .g1 { animation: g1 7s infinite; }
  .g2 { animation: g2 7s infinite; } .g3 { animation: g3 7s infinite; }
  .arrive { animation: arrive 7s infinite; }
  .pulse  { animation: pulse 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  .march  { animation: march 1.2s linear infinite; }

  @keyframes pkt {
    0%   { transform: translateX(0); opacity: 0; }
    4%   { opacity: 1; }
    14%, 20% { transform: translateX(118px); }
    30%  { transform: translateX(238px); opacity: 1; }
    31%, 57% { opacity: 0; transform: translateX(238px); }
    58%  { opacity: 1; transform: translateX(358px); }
    66%  { transform: translateX(358px); }
    76%, 80% { transform: translateX(478px); opacity: 1; }
    92%  { transform: translateX(620px); opacity: 1; }
    96%, 100% { transform: translateX(620px); opacity: 0; }
  }
  @keyframes parts {
    0%, 30% { opacity: 0; transform: translateX(0); }
    32% { opacity: 1; }
    56% { opacity: 1; transform: translateX(120px); }
    58%, 100% { opacity: 0; transform: translateX(120px); }
  }
  @keyframes ok { 0%, 58% { opacity: 0; } 62%, 72% { opacity: 1; } 78%, 100% { opacity: 0; } }
  @keyframes g0 { 0%, 12% { opacity: 0; } 15%, 21% { opacity: .9; } 26%, 100% { opacity: 0; } }
  @keyframes g1 { 0%, 28% { opacity: 0; } 31%, 40% { opacity: .9; } 46%, 100% { opacity: 0; } }
  @keyframes g2 { 0%, 56% { opacity: 0; } 59%, 67% { opacity: .9; } 72%, 100% { opacity: 0; } }
  @keyframes g3 { 0%, 74% { opacity: 0; } 77%, 82% { opacity: .9; } 87%, 100% { opacity: 0; } }
  @keyframes arrive { 0%, 90% { opacity: .35; } 94%, 100% { opacity: 1; } }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .35; } }
  @keyframes march { to { stroke-dashoffset: -14; } }

  @media (prefers-reduced-motion: reduce) {
    .pkt, .parts, .okbadge, .glow, .arrive, .pulse, .march { animation: none; }
    .arrive { opacity: 1; }
  }
</style>
  <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15222B" flood-opacity="0.1"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#0B7A6B"/>
  </marker>
  <marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4F53B0"/>
  </marker>
</defs>
